<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><style>
body { font-family: system-ui, sans-serif; max-width: 560px; margin: 40px auto; padding: 0 20px; background: #0f172a; color: #e2e8f0; }
textarea { width: 100%; box-sizing: border-box; background: #1e293b; border: 1px solid #334155; color: #e2e8f0; border-radius: 6px; padding: 8px; }
button { margin-top: 10px; padding: 9px 20px; border: none; border-radius: 8px; background: #22c55e; color: #052e16; font-weight: 700; cursor: pointer; }
p { color: #94a3b8; font-size: 13px; }
</style></head>
<body>
<h2>🔒 FocusLock — blocklist</h2>
<p>One domain per line. These are blocked during every session (unless you whitelist them for that session).</p>
<textarea id="bl" rows="12"></textarea><br>
<button id="save">Save</button> <span id="ok"></span>
<script>
(async () => {
  const st = await chrome.storage.local.get(["blocklist"]);
  document.getElementById("bl").value = (st.blocklist || []).join("\n");
  document.getElementById("save").onclick = async () => {
    const list = document.getElementById("bl").value.split("\n").map((s) => s.trim().toLowerCase()).filter(Boolean);
    await chrome.storage.local.set({ blocklist: list });
    document.getElementById("ok").textContent = "✓ saved";
    setTimeout(() => document.getElementById("ok").textContent = "", 2000);
  };
})();
</script>
</body>
</html>
