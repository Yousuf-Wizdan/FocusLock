<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="styles/tokens.css">
<link rel="stylesheet" href="styles/base.css">
<link rel="stylesheet" href="styles/components.css">
<style>
  body { width: 360px; min-height: 520px; max-height: 600px; overflow-y: auto; }
  header.top { display: flex; align-items: center; gap: 8px; padding: 12px 16px 10px; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--bg); z-index: 5; }
  header .brand { font-size: 13px; font-weight: 700; letter-spacing: -0.01em; display: flex; align-items: center; gap: 8px; }
  header .sub { font-size: 11px; color: var(--text-secondary); }
  header .sp { flex: 1; }
  main { padding: 16px; display: flex; flex-direction: column; gap: 16px; padding-bottom: 20px; }
  .timer-wrap { text-align: center; padding: 20px 12px 14px; }
  .timer-wrap .phase { font-size: 11px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent); margin-bottom: 4px; }
  .timer-wrap .goal { font-size: 13px; font-weight: 600; margin-top: 8px; }
  .timer-wrap .next { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }
  .timer-wrap .progress { margin-top: 14px; }
  .controls { display: flex; gap: 8px; }
  .controls .btn { flex: 1; }
  .view { display: none; flex-direction: column; gap: 16px; }
  .view.on { display: flex; }
  nav.tabs { display: flex; border-top: 1px solid var(--border); position: sticky; bottom: 0; background: var(--bg); }
  nav.tabs button { flex: 1; border: none; background: none; color: var(--text-secondary); font-size: 11px; font-weight: 600; padding: 10px 4px 12px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 3px; font-family: inherit; }
  nav.tabs button[aria-selected="true"] { color: var(--accent); }
  nav.tabs button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .lede { font-size: 13px; color: var(--text-secondary); line-height: 1.55; }
  .recent-row { display: flex; justify-content: space-between; gap: 8px; font-size: 12.5px; padding: 8px 0; border-bottom: 1px solid var(--border); }
  .recent-row:last-child { border-bottom: none; }
  .recent-row .m { color: var(--text-secondary); font-variant-numeric: tabular-nums; }
  .day-row { padding: 9px 0; border-bottom: 1px solid var(--border); }
  .day-row:last-child { border-bottom: none; }
  .day-row .top { display: flex; justify-content: space-between; font-size: 12.5px; }
  .day-row .m { color: var(--text-secondary); font-variant-numeric: tabular-nums; }
  @media (max-width: 340px) { body { width: 320px; } .timer-big { font-size: 48px; } }
</style>
</head>
<body>
<header class="top">
  <div>
    <div class="brand"><span class="dot-live" id="liveDot" style="visibility:hidden" aria-hidden="true"></span>FocusLock</div>
    <div class="sub" id="headSub">Study session</div>
  </div>
  <div class="sp"></div>
  <span class="badge" id="streakBadge" style="display:none"></span>
  <button class="icon-btn" id="gearBtn" aria-label="Open settings"></button>
</header>
<main>
  <div class="view on" id="view-focus" role="tabpanel" aria-label="Focus" tabindex="0">
    <div id="stateHost" style="display:flex;flex-direction:column;gap:16px"></div>
  </div>
  <div class="view" id="view-journal" role="tabpanel" aria-label="Journal" tabindex="0">
    <section class="section" aria-label="This week">
      <h2>Journal</h2>
      <div id="weekSummary" class="hint"></div>
      <div id="journalList"></div>
    </section>
    <section class="section" aria-label="Consistency">
      <h2>Consistency</h2>
      <div id="consistency" class="hint"></div>
    </section>
  </div>
  <div class="view" id="view-sites" role="tabpanel" aria-label="Sites" tabindex="0">
    <section class="section" aria-label="Study pages">
      <h2>Study pages</h2>
      <div id="sitesStudy"></div>
    </section>
    <section class="section" aria-label="Parked urges">
      <h2>Park this for later</h2>
      <div id="sitesUrges"></div>
      <div style="display:flex;gap:8px;margin-top:4px">
        <input class="input" id="urgeInput" type="text" maxlength="200" placeholder="What did you want to check?" aria-label="What did you want to check?" style="flex:1">
        <button class="btn btn-secondary" id="urgeBtn">Park</button>
      </div>
      <div class="hint">We&rsquo;ll keep it here until your session ends.</div>
    </section>
    <section class="section" aria-label="Distraction list">
      <h2>Distraction list</h2>
      <div id="sitesBlocked" class="hint"></div>
      <div><button class="btn btn-quiet btn-sm" id="editSites">Edit in Settings</button></div>
    </section>
  </div>
</main>
<nav class="tabs" role="tablist" aria-label="Popup sections">
  <button role="tab" aria-selected="true" data-view="focus" id="tab-focus">Focus</button>
  <button role="tab" aria-selected="false" data-view="journal" id="tab-journal">Journal</button>
  <button role="tab" aria-selected="false" data-view="sites" id="tab-sites">Sites</button>
</nav>
<script src="ui.js"></script>
<script src="popup.js"></script>
</body>
</html>
