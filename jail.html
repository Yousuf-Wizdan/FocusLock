<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Locked — FocusLock</title>
<style>
body { font-family: system-ui, sans-serif; background: #0f172a; color: #e2e8f0; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 24px; }
.card { text-align: center; max-width: 460px; padding: 40px 32px; background: #1e293b55; border: 1px solid #334155; border-radius: 20px; }
.big { font-size: 72px; }
h1 { font-size: 24px; margin: 10px 0 6px; }
p { color: #94a3b8; font-size: 14px; }
#count { font-size: 60px; font-weight: 800; color: #fbbf24; }
.dest { display: inline-flex; align-items: center; gap: 8px; background: #0f172a; border: 1px solid #334155; border-radius: 10px; padding: 8px 14px; margin-top: 10px; font-size: 13.5px; color: #cbd5e1; max-width: 100%; }
.dest span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
button { margin-top: 18px; padding: 11px 26px; border: none; border-radius: 10px; background: #22c55e; color: #052e16; font-weight: 700; font-size: 14px; cursor: pointer; }
</style></head>
<body>
<div class="card">
  <div class="big">🔒</div>
  <h1>This tab is jailed</h1>
  <p>Tab-switch <b id="n"></b> detected — you wandered to <b id="where">…</b>. Back to study in…</p>
  <div id="count">3</div>
  <div><span class="dest">📍 <span id="host">…</span></span></div>
  <p>Every switch is counted. Your future self is watching.</p>
  <button id="back">← Back to study tab</button>
</div>
<script>
const q = new URLSearchParams(location.search);
document.getElementById("n").textContent = "#" + (q.get("n") || "?");
const host = q.get("from") || "an unknown tab";
document.getElementById("where").textContent = host;
document.getElementById("host").textContent = host;
let s = parseInt(q.get("wait")) || 3;
const el = document.getElementById("count");
el.textContent = s;
const t = setInterval(() => { s--; el.textContent = Math.max(s, 0); if (s <= 0) clearInterval(t); }, 1000);
document.getElementById("back").onclick = () => history.back();
</script>
</body>
</html>
