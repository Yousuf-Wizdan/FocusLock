<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Locked — FocusLock</title>
<style>
body { font-family: system-ui, sans-serif; background: #0f172a; color: #e2e8f0; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
.card { text-align: center; max-width: 420px; padding: 40px; }
.big { font-size: 90px; }
h1 { font-size: 26px; margin: 8px 0; }
p { color: #94a3b8; }
#count { font-size: 64px; font-weight: 800; color: #fbbf24; }
a { color: #38bdf8; }
button { margin-top: 16px; padding: 10px 22px; border: none; border-radius: 8px; background: #22c55e; color: #052e16; font-weight: 700; cursor: pointer; }
</style></head>
<body>
<div class="card">
  <div class="big">🔒</div>
  <h1>This tab is jailed</h1>
  <p id="msg">Tab-switch <b id="n"></b> detected. Back to study in…</p>
  <div id="count">3</div>
  <p>Every switch is counted. Your future self is watching.</p>
  <button id="back">Back to study tab ⏎</button>
</div>
<script>
const q = new URLSearchParams(location.search);
document.getElementById("n").textContent = "#" + (q.get("n") || "?");
let s = parseInt(q.get("wait")) || 3;
const el = document.getElementById("count");
el.textContent = s;
const t = setInterval(() => { s--; el.textContent = Math.max(s, 0); if (s <= 0) clearInterval(t); }, 1000);
document.getElementById("back").onclick = () => history.back();
</script>
</body>
</html>
