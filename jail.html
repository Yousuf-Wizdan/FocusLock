<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="styles/tokens.css">
<link rel="stylesheet" href="styles/base.css">
<link rel="stylesheet" href="styles/components.css">
<title>FocusLock — take a breath</title>
</head>
<body>
<div class="shell">
  <main class="card" aria-labelledby="jTitle" id="st-waiting">
    <div class="kicker">Tab switch <span id="jN"></span> · noticed</div>
    <h1 id="jTitle">Take a breath.</h1>
    <p class="lede" style="margin:8px 0 12px">You tried to open a page outside your session. That&rsquo;s okay — your study session is still here.</p>
    <div class="timer-big" id="jClock" role="timer" aria-live="polite" style="text-align:center;margin:4px 0 12px">3</div>
    <div class="rowline" aria-label="Paused page">
      <span class="fav-fallback" id="jLetter" aria-hidden="true">?</span>
      <div class="grow"><div class="t" id="jHost">…</div><div class="s">On hold for a few seconds</div></div>
    </div>
    <div class="controls" style="display:flex;gap:8px;margin-top:12px;flex-direction:column">
      <button class="btn btn-primary btn-block" id="jBack" disabled>Back to study</button>
      <button class="btn btn-secondary btn-block" id="jPark">Park this urge</button>
    </div>
    <div class="hint" id="jTotal" style="margin-top:10px"></div>
  </main>
  <main class="card" aria-labelledby="rTitle" id="st-returning" hidden>
    <div class="kicker">Returning</div>
    <h1 id="rTitle">Back to your study tab.</h1>
    <p class="lede">Your focus session is still active.</p>
  </main>
</div>
<script src="ui.js"></script>
<script src="jail.js"></script>
</body>
</html>
