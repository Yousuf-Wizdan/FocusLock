<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8">
<link rel="stylesheet" href="fonts/fonts.css"><title>Break — step away</title>
<style>
:root { color-scheme: dark; }
body { font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif; background: #14120F; color: #EDE8DE; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 24px; font-size: 14px; line-height: 1.6; }
.card { max-width: 420px; width: 100%; background: #1D1A16; border: 1px solid #2E2A23; border-radius: 8px; padding: 24px; }
.kicker { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: #C97B4A; margin: 0 0 6px; }
h1 { font-size: 20px; margin: 0 0 4px; letter-spacing: -0.01em; }
#count { font-size: 48px; font-weight: 700; letter-spacing: -0.02em; font-family: "Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace; margin: 6px 0 2px; font-variant-numeric: tabular-nums; }
.rules { background: #14120F; border: 1px solid #2E2A23; border-radius: 6px; padding: 10px 14px; margin: 0 0 12px; font-size: 13px; line-height: 1.9; color: #A39E93; }
button { width: 100%; padding: 10px; border-radius: 6px; background: transparent; color: #A39E93; border: 1px solid #2E2A23; font-weight: 600; font-size: 13px; cursor: pointer; font-family: inherit; }
button:hover { color: #EDE8DE; border-color: #5A544A; }
button:focus-visible { outline: 2px solid #E2A63B; outline-offset: 2px; }
small { color: #5A544A; display: block; margin-top: 10px; font-size: 11.5px; }
</style></head>
<body>
<div class="card">
  <p class="kicker">Enforced break</p>
  <h1>Step away from the screen</h1>
  <div id="count" role="timer">10:00</div>
  <div class="rules">
    Water · stretch · walk · eyes off the screen<br>
    No new tabs, no Shorts, no “quick check”
  </div>
  <p style="color:#A39E93;font-size:13px">Focus resumes automatically when the timer ends.</p>
  <button id="skip">Skip break</button>
  <small>Skipping is allowed and logged in the session summary.</small>
</div>
<script>
let s = (parseInt(new URLSearchParams(location.search).get("wait")) || 10) * 60;
const el = document.getElementById("count");
const pad = (n) => String(n).padStart(2, "0");
function draw() { el.textContent = `${Math.floor(s / 60)}:${pad(s % 60)}`; }
draw();
const t = setInterval(() => {
  s = Math.max(0, s - 1); draw();
  if (s <= 0) { clearInterval(t); el.textContent = "Back to study"; }
}, 1000);
document.getElementById("skip").onclick = async () => {
  try { await chrome.runtime.sendMessage({ type: "SKIP_BREAK" }); } catch { /* worker asleep */ }
  window.close();
};
</script>
</body>
</html>
