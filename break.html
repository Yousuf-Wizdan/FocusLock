<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8">
<link rel="stylesheet" href="fonts/fonts.css"><title>Break — step away</title>
<style>
:root { color-scheme: light dark; }
body { font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif; background: #F5F1E8; color: #1C1917; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 24px; font-size: 14px; line-height: 1.6; }
@media (prefers-color-scheme: dark) {
  body { background: #14120F; color: #EDE8DE; }
  .card { background: #1D1A16 !important; border-color: #2E2A23 !important; }
  .rules { background: #14120F !important; border-color: #2E2A23 !important; color: #A39E93 !important; }
  p { color: #A39E93 !important; }
  button { color: #A39E93 !important; border-color: #2E2A23 !important; }
  small { color: #5A544A !important; }
}
.card { max-width: 420px; width: 100%; background: #FFFFFF; border: 1px solid #E3DCC8; border-radius: 8px; padding: 24px; }
.kicker { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: #57534E; margin: 0 0 6px; }
h1 { font-size: 20px; margin: 0 0 4px; letter-spacing: -0.01em; }
#count { font-size: 48px; font-weight: 700; letter-spacing: -0.02em; font-family: "Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace; margin: 6px 0 2px; font-variant-numeric: tabular-nums; }
.rules { background: #F5F1E8; border: 1px solid #E3DCC8; border-radius: 6px; padding: 10px 14px; margin: 0 0 12px; font-size: 13px; line-height: 1.9; }
button { width: 100%; padding: 10px; border-radius: 6px; background: transparent; border: 1px solid #D6CCB2; font-weight: 600; font-size: 13px; cursor: pointer; font-family: inherit; }
button:focus-visible { outline: 2px solid #B45309; outline-offset: 2px; }
small { color: #8A8478; display: block; margin-top: 10px; font-size: 12px; }
p.note { color: #57534E; font-size: 13px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style></head>
<body>
<main class="card" aria-labelledby="h">
  <p class="kicker">Break — look away from the screen</p>
  <h1 id="h">Stretch, water, eyes off the screen.</h1>
  <div id="count" role="timer" aria-live="polite">10:00</div>
  <div class="rules">
    Stand up · water · walk a little<br>
    No new tabs, no Shorts, no quick checks
  </div>
  <p class="note">Focus resumes automatically when the timer ends.</p>
  <button id="skip">Skip break</button>
  <small>Skipping is allowed and noted in your session summary.</small>
</main>
<script>
(function () {
  "use strict";
  let s = (parseInt(new URLSearchParams(location.search).get("wait"), 10) || 10) * 60;
  const el = document.getElementById("count");
  const pad = (n) => String(n).padStart(2, "0");
  function draw() { el.textContent = Math.floor(s / 60) + ":" + pad(s % 60); }
  draw();
  const t = setInterval(() => {
    s = Math.max(0, s - 1); draw();
    if (s <= 0) { clearInterval(t); el.textContent = "Back to study"; }
  }, 1000);
  document.getElementById("skip").onclick = async () => {
    try { await chrome.runtime.sendMessage({ type: "SKIP_BREAK" }); } catch { /* worker asleep */ }
    window.close();
  };
})();
</script>
</body>
</html>
