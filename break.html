<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="styles/tokens.css">
<link rel="stylesheet" href="styles/base.css">
<link rel="stylesheet" href="styles/components.css">
<title>FocusLock — break</title>
</head>
<body>
<div class="shell">
  <main class="card" aria-labelledby="bTitle">
    <div class="kicker">Break</div>
    <h1 id="bTitle">Step away for <span id="bMins">10</span> minutes.</h1>
    <p class="lede" id="bDone" style="margin:8px 0 12px"></p>
    <div class="timer-big" id="bClock" role="timer" aria-live="polite" style="text-align:center;margin:4px 0 12px">10:00</div>
    <div class="rowline" aria-label="Break suggestions">
      <div class="grow"><div class="t">Look away from the screen</div><div class="s">Stretch · water · walk a little</div></div>
    </div>
    <div class="field" style="margin-top:12px"><label>Next</label>
      <div class="hint" id="bNext">Focus block</div></div>
    <div class="controls" style="display:flex;margin-top:4px">
      <button class="btn btn-secondary btn-block" id="bSkip">Finish break early</button>
    </div>
    <div class="hint" style="margin-top:10px">Focus resumes automatically when the timer ends. Finishing early is noted in your summary.</div>
  </main>
</div>
<script src="ui.js"></script>
<script src="break.js"></script>
</body>
</html>
