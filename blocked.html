<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Blocked — study first</title>
<style>
body { font-family: system-ui, sans-serif; background: #0f172a; color: #e2e8f0; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 24px; }
.card { text-align: center; max-width: 460px; padding: 40px 32px; background: #1e293b55; border: 1px solid #334155; border-radius: 20px; }
.big { font-size: 72px; }
h1 { font-size: 24px; margin: 10px 0 6px; }
p { color: #94a3b8; font-size: 14px; line-height: 1.6; }
.site { display: inline-flex; align-items: center; gap: 8px; background: #0f172a; border: 1px solid #ef444466; border-radius: 10px; padding: 9px 14px; margin-top: 12px; font-size: 14px; }
.site img { width: 18px; height: 18px; border-radius: 4px; }
.site b { color: #fca5a5; }
button { margin-top: 18px; padding: 11px 26px; border: none; border-radius: 10px; background: #0ea5e9; color: #041c2c; font-weight: 700; font-size: 14px; cursor: pointer; }
small { color: #64748b; display: block; margin-top: 14px; word-break: break-all; font-size: 11px; }
</style></head>
<body>
<div class="card">
  <div class="big" id="emoji">📵</div>
  <h1 id="title">Blocked until session ends</h1>
  <p id="desc">This site is on your blocklist. It'll open automatically after your session. Park the urge instead.</p>
  <div><span class="site"><img id="fav" style="display:none"><span>🚫 <b id="host">…</b></span></span></div>
  <br><button onclick="history.back()">← Back to study</button>
  <small id="from"></small>
</div>
<script>
const q = new URLSearchParams(location.search);
const raw = q.get("from") || "";
let host = "";
try { host = new URL(raw).hostname.replace(/^www\./, ""); } catch { host = raw; }
document.getElementById("host").textContent = host || "this page";
document.getElementById("from").textContent = raw;
if (host) {
  const img = document.getElementById("fav");
  img.src = "https://www.google.com/s2/favicons?domain=" + encodeURIComponent(host) + "&sz=64";
  img.onload = () => img.style.display = "";
  img.onerror = () => img.style.display = "none";
}
if (q.get("why") === "yt") {
  document.getElementById("emoji").textContent = "🎬";
  document.getElementById("title").textContent = "Not study — blocked";
  document.getElementById("desc").textContent = "Shorts, home feed, trending and explore stay blocked during sessions. Your lecture, search, playlist and channel pages always stay open. Go back to the video.";
}
</script>
</body>
</html>
