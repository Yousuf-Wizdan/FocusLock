<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8">
<link rel="stylesheet" href="fonts/fonts.css"><title>Blocked — back to study</title>
<style>
/* Blocked page: a firm librarian, not a bouncer. Name the site, one way back. */
body { font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif; background: #F5F1E8; color: #1C1917; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 24px; font-size: 14px; line-height: 1.6; }
.card { max-width: 440px; background: #FFFFFF; border: 1px solid #E2D9C3; border-left: 4px solid #9F1239; border-radius: 0 8px 8px 0; padding: 28px 30px; }
.kicker { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: #9F1239; margin: 0 0 6px; }
h1 { font-size: 21px; margin: 0 0 6px; letter-spacing: -0.01em; }
p { color: #57534E; margin: 0 0 14px; font-size: 13.5px; }
.site { display: flex; align-items: center; gap: 9px; background: #F5F1E8; border: 1px solid #E2D9C3; border-radius: 6px; padding: 8px 12px; font-size: 13px; margin-bottom: 16px; }
.site img { width: 18px; height: 18px; border-radius: 3px; }
.site b { font-weight: 650; }
.row { display: flex; gap: 8px; }
button, a.btn { flex: 1; text-align: center; text-decoration: none; padding: 10px; border-radius: 6px; font-weight: 650; font-size: 13.5px; cursor: pointer; font-family: inherit; }
#back { background: #1C1917; color: #FAF7F0; border: 1px solid #1C1917; }
#park { background: transparent; color: #1C1917; border: 1px solid #D6CCB2; }
button:focus-visible, a:focus-visible { outline: 2px solid #1B5E3B; outline-offset: 2px; }
small { color: #A8A29E; display: block; margin-top: 12px; word-break: break-all; font-size: 11px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style></head>
<body>
<div class="card">
  <p class="kicker" id="kicker">Blocked during focus</p>
  <h1 id="title">Not now. Study first.</h1>
  <p id="desc">This site waits until your session ends. If it's an urge, park it — you'll see it after, with the site named.</p>
  <div class="site"><img id="fav" alt="" style="display:none"><span>Blocked: <b id="host">…</b></span></div>
  <div class="row">
    <button id="back">Back to study</button>
    <a class="btn" id="park" href="#">Park this urge</a>
  </div>
  <small id="from"></small>
</div>
<script>
const q = new URLSearchParams(location.search);
const raw = q.get("from") || "";
let host = "";
try { host = new URL(raw).hostname.replace(/^www\./, ""); } catch { host = raw; }
document.getElementById("host").textContent = host || "this page";
document.getElementById("from").textContent = raw;
if (host) {
  const img = document.getElementById("fav");
  img.src = "https://www.google.com/s2/favicons?domain=" + encodeURIComponent(host) + "&sz=64";
  img.onload = () => img.style.display = "";
  img.onerror = () => img.style.display = "none";
}
if (q.get("why") === "yt") {
  document.getElementById("kicker").textContent = "YouTube study guard";
  document.getElementById("title").textContent = "Shorts can wait. The lecture can't.";
  document.getElementById("desc").textContent = "Shorts, home, trending and explore stay blocked in sessions. Watch, search, playlists and channels stay open.";
}
document.getElementById("back").onclick = () => history.back();
document.getElementById("park").onclick = async (e) => {
  e.preventDefault();
  const text = host ? ("check " + host) : raw;
  try { await chrome.runtime.sendMessage({ type: "PARK_URGE", text }); } catch { /* worker asleep */ }
  history.back();
};
</script>
</body>
</html>
