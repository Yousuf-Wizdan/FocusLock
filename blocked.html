<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="styles/tokens.css">
<link rel="stylesheet" href="styles/base.css">
<link rel="stylesheet" href="styles/components.css">
<title>FocusLock — this page is outside your study session</title>
</head>
<body>
<div class="shell">
  <main class="card" aria-labelledby="flTitle" id="st-blocked">
    <div class="kicker" id="flKicker">Outside your study session</div>
    <h1 id="flTitle">This page is outside your study session.</h1>
    <p class="lede" id="flGoal" style="margin:8px 0 12px"></p>
    <div class="rowline" aria-label="Paused site">
      <span class="fav-fallback" id="flLetter" aria-hidden="true">?</span>
      <div class="grow"><div class="t" id="flHost">…</div><div class="s" id="flLeft"></div></div>
    </div>
    <div class="field" style="margin-top:12px"><label>What would you like to do?</label>
      <div class="controls" style="display:flex;gap:8px;flex-direction:column">
        <button class="btn btn-primary btn-block" id="flBack">Back to study</button>
        <button class="btn btn-secondary btn-block" id="flPark">Park the urge</button>
        <button class="btn btn-quiet btn-block" id="flPass">Emergency access — 2 min</button>
      </div>
    </div>
    <details id="flWhyBox" style="margin-top:4px">
      <summary style="cursor:pointer;font-weight:600;font-size:12.5px">Why is this blocked?</summary>
      <div class="hint" id="flWhy" style="margin-top:6px"></div>
    </details>
  </main>

  <main class="card" aria-labelledby="emTitle" id="st-em-request" hidden>
    <div class="kicker">Emergency access</div>
    <h1 id="emTitle">Why do you need access?</h1>
    <div class="field" style="margin-top:12px"><label for="emReason">Type a reason</label>
      <input class="input" id="emReason" type="text" maxlength="140" placeholder="e.g. class link was sent here" autocomplete="off">
      <div class="hint">This will be logged in your session.</div></div>
    <div class="controls" style="display:flex;gap:8px">
      <button class="btn btn-secondary" id="emCancel" style="flex:1">Cancel</button>
      <button class="btn btn-primary" id="emGo" style="flex:1">Continue</button>
    </div>
  </main>

  <main class="card" aria-labelledby="acTitle" id="st-em-active" hidden>
    <div class="kicker">Emergency access</div>
    <h1 id="acTitle">Access ends automatically.</h1>
    <div class="timer-big" id="acClock" role="timer" aria-live="polite" style="font-size:44px;text-align:center;margin:8px 0">2:00</div>
    <div class="hint" style="text-align:center" id="acHost"></div>
    <div class="controls" style="display:flex;margin-top:12px">
      <button class="btn btn-primary btn-block" id="acOpen">Continue to site</button>
    </div>
  </main>
</div>
<script src="ui.js"></script>
<script src="blocked.js"></script>
</body>
</html>
